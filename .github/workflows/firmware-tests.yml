name: Firmware Tests

on:
  push:
    branches:
      - main
      - develop
    paths:
      - projects/rc_vehicle/firmware/**
      - projects/firmware_common/**
      - .github/workflows/firmware-tests.yml
  pull_request:
    branches:
      - main
      - develop
    paths:
      - projects/rc_vehicle/firmware/**
      - projects/firmware_common/**
      - .github/workflows/firmware-tests.yml

permissions:
  contents: read

jobs:
  firmware-web-tests:
    name: Web UI (Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/rc_vehicle/firmware/esp32_common/web
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: projects/rc_vehicle/firmware/esp32_common/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run web UI tests
        run: npm test

  firmware-tests:
    name: GTest (host)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/rc_vehicle/firmware/tests
    steps:
      - uses: actions/checkout@v4

      - name: Configure (CMake)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Run unit tests
        run: ./build/unit_tests --gtest_output=xml:test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firmware-test-results
          path: projects/rc_vehicle/firmware/tests/test-results.xml
          if-no-files-found: ignore

  firmware-coverage:
    name: Firmware Coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/rc_vehicle/firmware/tests
    steps:
      - uses: actions/checkout@v4

      - name: Install coverage tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes lcov

      - name: Configure coverage build
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DENABLE_COVERAGE=ON

      - name: Generate coverage report
        run: cmake --build build --target coverage --parallel

      - name: Check coverage baseline
        run: lcov --summary build/lcov.info --fail-under-lines 92

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firmware-coverage-report
          path: projects/rc_vehicle/firmware/tests/build/lcov-report
          if-no-files-found: error

  esp32s3-build:
    name: ESP32-S3 build (ESP-IDF ${{ matrix.idf }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        # Версия ESP-IDF для прошивки (matrix — потому что в `container:` контекст env
        # недоступен). Менять вместе с: esp32_s3/dependencies.lock (сверяется ниже),
        # esp32_s3/README.md, firmware/README.md, docs/esp32s3-setup.md, CLAUDE.md,
        # подсказкой в firmware/Makefile.
        idf: ['v6.1']
    container: espressif/idf:${{ matrix.idf }}
    env:
      IDF_TARGET: esp32s3
    steps:
      - uses: actions/checkout@v4

      - name: Build firmware and report size
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          # Та же команда, что у разработчиков (`make build` в projects/rc_vehicle/firmware):
          # wrapper run_idf поднимает окружение IDF и выполняет migrate_cpu_freq_sdkconfig.sh.
          make -C projects/rc_vehicle/firmware build
          make -C projects/rc_vehicle/firmware size 2>&1 | tee projects/rc_vehicle/firmware/esp32_s3/size.txt

      - name: Check dependencies.lock matches the ESP-IDF in CI
        # Запускается и после упавшей сборки, чтобы устаревший lock был виден сразу.
        if: ${{ !cancelled() }}
        shell: bash
        # Component manager переписывает lock, если версия IDF или зависимости
        # разошлись с закоммиченными.
        run: |
          lock=projects/rc_vehicle/firmware/esp32_s3/dependencies.lock
          if ! git diff --exit-code -- "$lock"; then
            echo "::error file=$lock::dependencies.lock не совпадает с ESP-IDF ${{ matrix.idf }} в CI." \
              "Соберите прошивку локально на этой версии IDF и закоммитьте обновлённый lock" \
              "(или поменяйте matrix.idf вместе с lock)."
            exit 1
          fi

      - name: Upload firmware image
        uses: actions/upload-artifact@v4
        with:
          name: rc-vehicle-esp32s3-firmware
          path: |
            projects/rc_vehicle/firmware/esp32_s3/build/rc_vehicle_esp32_s3.bin
            projects/rc_vehicle/firmware/esp32_s3/build/rc_vehicle_esp32_s3.elf
            projects/rc_vehicle/firmware/esp32_s3/build/bootloader/bootloader.bin
            projects/rc_vehicle/firmware/esp32_s3/build/partition_table/partition-table.bin
            projects/rc_vehicle/firmware/esp32_s3/build/flasher_args.json
            projects/rc_vehicle/firmware/esp32_s3/size.txt
          if-no-files-found: error

  sil-sim:
    name: SIL (sim_host + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build sim_host
        working-directory: projects/rc_vehicle/firmware/tests
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)" --target sim_host

      - name: Install sim package
        working-directory: projects/rc_vehicle/firmware/sim
        run: pip install -e ".[dev]"

      - name: Run pytest (model + replay + closed-loop + validation)
        working-directory: projects/rc_vehicle/firmware/sim
        env:
          SIM_HOST_BIN: ${{ github.workspace }}/projects/rc_vehicle/firmware/tests/build/sim_host
        run: python -m pytest -q
