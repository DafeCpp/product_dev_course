name: Firmware clang-format

on:
  pull_request:
    branches:
      - main
      - develop
    paths:
      - projects/rc_vehicle/firmware/**
      - projects/bench_controller/firmware/**
      - projects/firmware_common/**
      - .pre-commit-config.yaml
      - scripts/install-pre-commit-hook.sh
      - .github/workflows/firmware-clang-format.yml

permissions:
  contents: read

jobs:
  clang-format:
    name: clang-format (изменённые строки)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Нужна история до базовой ветки для merge-base
          fetch-depth: 0

      # Версия закреплена: разные мажорные версии clang-format
      # форматируют по-разному. Локальный pre-commit hook использует тот же
      # бинарник `clang-format-20`.
      - name: Install clang-format-20
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-format-20
          clang-format-20 --version

      # Проверяются только строки, изменённые в PR: дерево прошивки пока
      # не полностью отформатировано, полная проверка дала бы шум по
      # незатронутым файлам. git-clang-format возвращает ненулевой код,
      # если изменённые строки отличаются от канонического форматирования.
      #
      # --extensions ограничивает проверку C/C++: иначе git-clang-format по
      # умолчанию берёт и .js (web UI), а .clang-format не содержит секции
      # JavaScript → clang-format падает с ошибкой и роняет весь чек (любой PR,
      # трогающий web/*.js). Стиль JS этим чеком не покрывается.
      - name: Check changed lines
        env:
          CF_EXT: c,cc,cpp,cxx,h,hh,hpp,hxx
        run: |
          base="$(git merge-base "origin/${GITHUB_BASE_REF}" HEAD)"
          if git-clang-format-20 --binary clang-format-20 \
              --extensions "$CF_EXT" --diff "$base" \
              -- projects/rc_vehicle/firmware/ \
                 projects/bench_controller/firmware/ \
                 projects/firmware_common/ > cf.diff; then
            echo "clang-format: OK"
          else
            echo "::error::Изменённые строки не соответствуют .clang-format. Запустите git-clang-format-20 для изменённых firmware-файлов."
            cat cf.diff
            exit 1
          fi
