name: Reusable Frontend Tests

on:
  workflow_call:
    inputs:
      run-all:
        description: Run every frontend app test job instead of using changed-file detection
        type: boolean
        default: false
      node-version-file:
        description: File that pins the Node.js runtime version
        type: string
        default: .nvmrc
      enforce-ratchet:
        description: Fail coverage jobs when configured line or branch floors regress
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  detect-changes:
    name: Detect changed frontend apps
    runs-on: ubuntu-latest
    outputs:
      experiment-portal: ${{ steps.detect.outputs.experiment-portal }}
      sensor-simulator: ${{ steps.detect.outputs.sensor-simulator }}
      auth-proxy: ${{ steps.detect.outputs.auth-proxy }}
      frontend-common: ${{ steps.detect.outputs.frontend-common }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed apps
        id: detect
        run: |
          if [ "${{ inputs.run-all }}" = "true" ]; then
            for app in experiment-portal sensor-simulator auth-proxy frontend-common; do
              echo "$app=true" >> $GITHUB_OUTPUT
              echo "✓ $app forced by run-all"
            done
            exit 0
          fi

          if [ "${{ github.event_name }}" == "pull_request" ]; then
            CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          else
            CHANGED_FILES=$(git diff --name-only ${{ github.event.before }} ${{ github.event.after }})
          fi

          echo "Changed files:"
          echo "$CHANGED_FILES"
          echo ""

          for app in experiment-portal sensor-simulator auth-proxy; do
            if echo "$CHANGED_FILES" | grep -Fxq "${{ inputs.node-version-file }}" || echo "$CHANGED_FILES" | grep -E "^projects/frontend/(apps/$app|common)/|\.github/workflows/(frontend-tests|reusable-frontend-tests)\.yml" > /dev/null; then
              echo "$app=true" >> $GITHUB_OUTPUT
              echo "✓ $app changed"
            else
              echo "$app=false" >> $GITHUB_OUTPUT
              echo "✗ $app not changed"
            fi
          done

          if echo "$CHANGED_FILES" | grep -Fxq "${{ inputs.node-version-file }}" || echo "$CHANGED_FILES" | grep -E "^(package(-lock)?\.json|projects/frontend/common/)|\.github/workflows/(frontend-tests|reusable-frontend-tests)\.yml" > /dev/null; then
            echo "frontend-common=true" >> $GITHUB_OUTPUT
            echo "✓ frontend-common changed"
          else
            echo "frontend-common=false" >> $GITHUB_OUTPUT
            echo "✗ frontend-common not changed"
          fi

  experiment-portal:
    name: experiment-portal tests
    needs: detect-changes
    if: needs.detect-changes.outputs.experiment-portal == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/frontend/apps/experiment-portal

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ${{ inputs.node-version-file }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run type check
        run: npm run type-check

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-experiment-portal
          path: projects/frontend/apps/experiment-portal/coverage
          if-no-files-found: ignore
          retention-days: 14

  frontend-common:
    name: frontend-common tests
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend-common == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ${{ inputs.node-version-file }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run type check
        run: npm run type-check --workspace=frontend-common

      - name: Run tests with coverage
        run: npm run test:coverage --workspace=frontend-common
        env:
          COVERAGE_ENFORCE_RATCHET: ${{ inputs.enforce-ratchet && 'true' || 'false' }}

      - name: Summarize coverage
        if: always() && hashFiles('projects/frontend/common/coverage/coverage-summary.json') != ''
        run: python3 "$GITHUB_WORKSPACE/scripts/coverage/check_ratchet.py" --component frontend-common --report projects/frontend/common/coverage/coverage-summary.json --format istanbul --min-lines 94 --min-branches 82 --enforce ${{ inputs.enforce-ratchet }}

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-frontend-common
          path: projects/frontend/common/coverage
          if-no-files-found: ignore
          retention-days: 14

  sensor-simulator:
    name: sensor-simulator tests
    needs: detect-changes
    if: needs.detect-changes.outputs.sensor-simulator == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/frontend/apps/sensor-simulator

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ${{ inputs.node-version-file }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            projects/frontend/apps/sensor-simulator/package-lock.json

      - name: Install workspace dependencies
        run: npm ci
        working-directory: .

      - name: Install dependencies
        run: npm ci

      - name: Run type check
        run: npm run type-check

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-sensor-simulator
          path: projects/frontend/apps/sensor-simulator/coverage
          if-no-files-found: ignore
          retention-days: 14

  auth-proxy:
    name: auth-proxy tests
    needs: detect-changes
    if: needs.detect-changes.outputs.auth-proxy == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/frontend/apps/auth-proxy

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ${{ inputs.node-version-file }}
          cache: npm
          cache-dependency-path: projects/frontend/apps/auth-proxy/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run type check
        run: npm run type-check

      - name: Run tests
        run: npm test

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-auth-proxy
          path: projects/frontend/apps/auth-proxy/coverage
          if-no-files-found: ignore
          retention-days: 14
