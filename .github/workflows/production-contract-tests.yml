name: Production Contract Tests

on:
  push:
    branches:
      - main
      - develop
    paths:
      - docker-compose.prod.yml
      - env.production.example
      - scripts/validate-production-env.sh
      - scripts/tests/test_production_deploy_contract.py
      - infrastructure/yandex-cloud/outputs.tf
      - infrastructure/yandex-cloud/object-storage.tf
      - infrastructure/yandex-cloud/variables.tf
      - .github/workflows/deploy.yml
      - .github/workflows/production-contract-tests.yml
      - Makefile
  pull_request:
    branches:
      - main
      - develop
    paths:
      - docker-compose.prod.yml
      - env.production.example
      - scripts/validate-production-env.sh
      - scripts/tests/test_production_deploy_contract.py
      - infrastructure/yandex-cloud/outputs.tf
      - infrastructure/yandex-cloud/object-storage.tf
      - infrastructure/yandex-cloud/variables.tf
      - .github/workflows/deploy.yml
      - .github/workflows/production-contract-tests.yml
      - Makefile

permissions:
  contents: read

jobs:
  production-contract:
    name: Production runtime contract
    runs-on: ubuntu-latest
    env:
      CR_REGISTRY: cr.yandex/ci-test-registry
      AUTH_DATABASE_URL: postgresql://auth_user:ci-secret@db.example.net:6432/auth_db?sslmode=verify-full
      EXPERIMENT_DATABASE_URL: postgresql://experiment_user:ci-secret@db.example.net:6432/experiment_db?sslmode=verify-full
      CONFIG_DATABASE_URL: postgresql://config_user:ci-secret@db.example.net:6432/config_db?sslmode=verify-full
      JWT_SECRET: ci-test-secret-longer-than-thirty-two-characters
      COOKIE_DOMAIN: prod.example.net
      CORS_ORIGINS: https://prod.example.net
      CORS_ALLOWED_ORIGINS: https://prod.example.net
      GRAFANA_ADMIN_PASSWORD: ci-test-grafana-secret
      REDIS_URL: redis://redis:6379/0
      TELEMETRY_BROKER_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: https://storage.yandexcloud.net
      S3_PUBLIC_ENDPOINT_URL: https://storage.yandexcloud.net
      S3_ACCESS_KEY: ci-test-access-key
      S3_SECRET_KEY: ci-test-secret-key
      S3_BUCKET: ci-test-artifacts
      S3_PRESIGN_EXPIRE_SECONDS: "3600"
      CONFIG_CLIENT_ENABLED: "true"
      CONFIG_CLIENT_URL: http://config-service:8005
      CONFIG_CLIENT_POLL_INTERVAL_SECONDS: "5.0"
    steps:
      - uses: actions/checkout@v4

      - name: Run contract tests
        run: make test-deploy-contract

      - name: Render production compose
        run: docker compose -f docker-compose.prod.yml config --quiet
