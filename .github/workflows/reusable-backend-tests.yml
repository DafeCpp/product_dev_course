      - name: Install coverage
        run: pip install coverage==7.13.4

      - name: Download all shard coverage data
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-data-experiment-service-*
          path: projects/backend/services/experiment-service/_cov_data
          merge-multiple: true

      - name: Combine and report
        run: |
          set -euo pipefail
          mv _cov_data/.coverage.shard-* . 2>/dev/null || true
          coverage combine
          coverage xml --fail-under=0 -o coverage.xml
          coverage json --fail-under=0 -o coverage.json
          coverage html --fail-under=0 -d htmlcov
          coverage lcov --fail-under=0 -o coverage.lcov
          coverage report --fail-under=0

      - name: Summarize coverage
        if: always() && hashFiles('projects/backend/services/experiment-service/coverage.json') != ''
        run: python "$GITHUB_WORKSPACE/scripts/coverage/check_ratchet.py" --component experiment-service --report coverage.json --format python --min-lines 77.39 --min-branches 56.82 --enforce ${{ inputs.enforce-ratchet }}

      - name: Upload merged coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-experiment-service
          path: |
            projects/backend/services/experiment-service/htmlcov
            projects/backend/services/experiment-service/coverage.xml
            projects/backend/services/experiment-service/coverage.json
            projects/backend/services/experiment-service/coverage.lcov
          if-no-files-found: ignore
          retention-days: 14

  telemetry-ingest-service:
