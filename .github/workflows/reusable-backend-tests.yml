      - name: Install dependencies
        run: poetry install --no-interaction --no-root

      - name: Run pytest (shard ${{ matrix.shard }}/2)
        run: |
          poetry run pytest -q \
            --shard-id=$(( ${{ matrix.shard }} - 1 )) \
            --num-shards=2 \
            --cov --cov-report= \
            --cov-fail-under=0

      - name: Rename coverage data file
        if: always()
        run: |
          ls -la .coverage* 2>/dev/null || true
          if [ -f .coverage ]; then
            mv .coverage .coverage.shard-${{ matrix.shard }}
          fi

      - name: Upload coverage data (shard ${{ matrix.shard }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-data-telemetry-ingest-service-${{ matrix.shard }}
          path: projects/backend/services/telemetry-ingest-service/.coverage.shard-${{ matrix.shard }}
