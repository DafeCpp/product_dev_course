name: Reusable Backend Tests

on:
  workflow_call:
    inputs:
      run-all:
        description: Run every backend service test job instead of using changed-file detection
        type: boolean
        default: false
      python-version:
        description: Python runtime version used by backend Docker images
        type: string
        default: "3.14"
      enforce-ratchet:
        description: Fail coverage jobs when configured line or branch floors regress
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  detect-changes:
    name: Detect changed services
    runs-on: ubuntu-latest
    outputs:
      backend-common: ${{ steps.detect.outputs.backend-common }}
      auth-service: ${{ steps.detect.outputs.auth-service }}
      script-service: ${{ steps.detect.outputs.script-service }}
      experiment-service: ${{ steps.detect.outputs.experiment-service }}
      telemetry-ingest-service: ${{ steps.detect.outputs.telemetry-ingest-service }}
      config-service: ${{ steps.detect.outputs.config-service }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed services
        id: detect
        run: |
          if [ "${{ inputs.run-all }}" = "true" ]; then
            for service in backend-common auth-service script-service experiment-service telemetry-ingest-service config-service; do
              echo "$service=true" >> $GITHUB_OUTPUT
              echo "✓ $service forced by run-all"
            done
            exit 0
          fi

          # Get changed files
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          else
            CHANGED_FILES=$(git diff --name-only ${{ github.event.before }} ${{ github.event.after }})
          fi

          # Check each service
          echo "Changed files:"
          echo "$CHANGED_FILES"
          echo ""

          if echo "$CHANGED_FILES" | grep -E "^projects/backend/common/|\.github/workflows/(backend-tests|reusable-backend-tests)\.yml" > /dev/null; then
            echo "backend-common=true" >> $GITHUB_OUTPUT
            echo "✓ backend-common changed"
          else
            echo "backend-common=false" >> $GITHUB_OUTPUT
            echo "✗ backend-common not changed"
          fi

          for service in auth-service script-service experiment-service telemetry-ingest-service config-service; do
            if echo "$CHANGED_FILES" | grep -E "^projects/backend/(services/$service|common)/|\.github/workflows/(backend-tests|reusable-backend-tests)\.yml" > /dev/null; then
              echo "$service=true" >> $GITHUB_OUTPUT
              echo "✓ $service changed"
            else
              echo "$service=false" >> $GITHUB_OUTPUT
              echo "✗ $service not changed"
            fi
          done

  backend-common:
    name: backend-common tests
    needs: detect-changes
    if: needs.detect-changes.outputs.backend-common == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/backend/common
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.8.3
          installer-parallel: true

      - name: Set up Python ${{ inputs.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: poetry
          cache-dependency-path: projects/backend/common/poetry.lock

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Run pytest with coverage
        run: poetry run pytest -q --cov --cov-report=

      - name: Create coverage reports
        if: always()
        run: |
          poetry run coverage xml --fail-under=0 -o coverage.xml
          poetry run coverage json --fail-under=0 -o coverage.json
          poetry run coverage html --fail-under=0 -d htmlcov
          poetry run coverage lcov --fail-under=0 -o coverage.lcov

      - name: Summarize coverage
        if: always() && hashFiles('projects/backend/common/coverage.json') != ''
        run: python "$GITHUB_WORKSPACE/scripts/coverage/check_ratchet.py" --component backend-common --report coverage.json --format python --min-lines 71.54 --min-branches 62.79 --enforce ${{ inputs.enforce-ratchet }}

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-backend-common
          path: |
            projects/backend/common/htmlcov
            projects/backend/common/coverage.xml
            projects/backend/common/coverage.json
            projects/backend/common/coverage.lcov
          if-no-files-found: ignore
          retention-days: 14

  auth-service:
    name: auth-service tests (shard ${{ matrix.shard }}/2)
    needs: detect-changes
    if: needs.detect-changes.outputs.auth-service == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    defaults:
      run:
        working-directory: projects/backend/services/auth-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.8.3
          installer-parallel: true

      - name: Set up Python ${{ inputs.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: poetry
          cache-dependency-path: projects/backend/services/auth-service/poetry.lock

      - name: Install PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql

      - name: Install dependencies
        run: poetry install --no-interaction --no-root

      - name: Run pytest (shard ${{ matrix.shard }}/2)
        run: |
          poetry run pytest -q \
            --shard-id=$(( ${{ matrix.shard }} - 1 )) \
            --num-shards=2 \
            --cov --cov-report= \
            --cov-fail-under=0

      - name: Rename coverage data file
        if: always()
        run: |
          ls -la .coverage* 2>/dev/null || true
          if [ -f .coverage ]; then
            mv .coverage .coverage.shard-${{ matrix.shard }}
          fi

      - name: Upload coverage data (shard ${{ matrix.shard }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-data-auth-service-${{ matrix.shard }}
          path: projects/backend/services/auth-service/.coverage.shard-${{ matrix.shard }}
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 1

  auth-service-coverage:
    name: auth-service coverage merge
    needs: [detect-changes, auth-service]
    if: always() && needs.detect-changes.outputs.auth-service == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/backend/services/auth-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ inputs.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install coverage
        run: pip install coverage==7.13.4

      - name: Download all shard coverage data
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-data-auth-service-*
          path: projects/backend/services/auth-service/_cov_data
          merge-multiple: true

      - name: Combine and report
        run: |
          set -euo pipefail
          mv _cov_data/.coverage.shard-* . 2>/dev/null || true
          coverage combine
          coverage xml --fail-under=0 -o coverage.xml
          coverage json --fail-under=0 -o coverage.json
          coverage html --fail-under=0 -d htmlcov
          coverage lcov --fail-under=0 -o coverage.lcov
          coverage report --fail-under=0

      - name: Summarize coverage
        if: always() && hashFiles('projects/backend/services/auth-service/coverage.json') != ''
        run: python "$GITHUB_WORKSPACE/scripts/coverage/check_ratchet.py" --component auth-service --report coverage.json --format python --min-lines 86.28 --min-branches 73.91 --enforce ${{ inputs.enforce-ratchet }}

      - name: Upload merged coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-auth-service
          path: |
            projects/backend/services/auth-service/htmlcov
            projects/backend/services/auth-service/coverage.xml
            projects/backend/services/auth-service/coverage.json
            projects/backend/services/auth-service/coverage.lcov
          if-no-files-found: ignore
          retention-days: 14

  script-service:
    name: script-service tests
    needs: detect-changes
    if: needs.detect-changes.outputs.script-service == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/backend/services/script-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.8.3
          installer-parallel: true

      - name: Set up Python ${{ inputs.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: poetry
          cache-dependency-path: projects/backend/services/script-service/poetry.lock

      - name: Install PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql

      - name: Install dependencies
        run: poetry install --no-interaction --no-root

      - name: Run pytest
        run: poetry run pytest -q --cov --cov-report= --cov-fail-under=0

      - name: Create coverage reports
        if: always()
        run: |
          poetry run coverage xml --fail-under=0 -o coverage.xml
          poetry run coverage json --fail-under=0 -o coverage.json
          poetry run coverage html --fail-under=0 -d htmlcov
          poetry run coverage lcov --fail-under=0 -o coverage.lcov

      - name: Summarize coverage
        if: always() && hashFiles('projects/backend/services/script-service/coverage.json') != ''
        run: python "$GITHUB_WORKSPACE/scripts/coverage/check_ratchet.py" --component script-service --report coverage.json --format python --min-lines 94.36 --min-branches 80.18 --enforce ${{ inputs.enforce-ratchet }}

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.job }}
          path: |
            ${{ github.workspace }}/projects/backend/services/${{ github.job }}/htmlcov
            ${{ github.workspace }}/projects/backend/services/${{ github.job }}/coverage.xml
            ${{ github.workspace }}/projects/backend/services/${{ github.job }}/coverage.json
            ${{ github.workspace }}/projects/backend/services/${{ github.job }}/coverage.lcov
          if-no-files-found: ignore
          retention-days: 14

  config-service:
    name: config-service tests
    needs: detect-changes
    if: needs.detect-changes.outputs.config-service == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/backend/services/config-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.8.3
          installer-parallel: true

      - name: Set up Python ${{ inputs.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: poetry
          cache-dependency-path: projects/backend/services/config-service/poetry.lock

      - name: Install PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql

      - name: Install dependencies
        run: poetry install --no-interaction --no-root

      - name: Run pytest
        run: poetry run pytest -q --cov --cov-report= --cov-fail-under=0

      - name: Create coverage reports
        if: always()
        run: |
          poetry run coverage xml --fail-under=0 -o coverage.xml
          poetry run coverage json --fail-under=0 -o coverage.json
          poetry run coverage html --fail-under=0 -d htmlcov
          poetry run coverage lcov --fail-under=0 -o coverage.lcov

      - name: Summarize coverage
        if: always() && hashFiles('projects/backend/services/config-service/coverage.json') != ''
        run: python "$GITHUB_WORKSPACE/scripts/coverage/check_ratchet.py" --component config-service --report coverage.json --format python --min-lines 91.06 --min-branches 79.48 --enforce ${{ inputs.enforce-ratchet }}

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-config-service
          path: |
            projects/backend/services/config-service/htmlcov
            projects/backend/services/config-service/coverage.xml
            projects/backend/services/config-service/coverage.json
            projects/backend/services/config-service/coverage.lcov
          if-no-files-found: ignore
          retention-days: 14

  experiment-service:
    name: experiment-service tests (shard ${{ matrix.shard }}/4)
    needs: detect-changes
    if: needs.detect-changes.outputs.experiment-service == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: projects/backend/services/experiment-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.8.3
          installer-parallel: true

      - name: Set up Python ${{ inputs.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: poetry
          cache-dependency-path: projects/backend/services/experiment-service/poetry.lock

      - name: Set up PostgreSQL 16 + TimescaleDB
        uses: ./.github/actions/setup-timescaledb

      - name: Install dependencies
        run: poetry install --no-interaction --no-root

      - name: Run pytest (shard ${{ matrix.shard }}/4)
        run: |
          poetry run pytest -q \
            --shard-id=$(( ${{ matrix.shard }} - 1 )) \
            --num-shards=4 \
            --cov --cov-report= \
            --cov-fail-under=0

      - name: Rename coverage data file
        if: always()
        run: |
          ls -la .coverage* 2>/dev/null || true
          if [ -f .coverage ]; then
            mv .coverage .coverage.shard-${{ matrix.shard }}
          fi

      - name: Upload coverage data (shard ${{ matrix.shard }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-data-experiment-service-${{ matrix.shard }}
          path: projects/backend/services/experiment-service/.coverage.shard-${{ matrix.shard }}
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 1

  experiment-service-coverage:
    name: experiment-service coverage merge
    needs: [detect-changes, experiment-service]
    if: always() && needs.detect-changes.outputs.experiment-service == 'true'
    runs-on: ubuntu-latest
