            projects/backend/services/telemetry-ingest-service/coverage.xml
            projects/backend/services/telemetry-ingest-service/coverage.json
            projects/backend/services/telemetry-ingest-service/coverage.lcov
          if-no-files-found: ignore
          retention-days: 14
