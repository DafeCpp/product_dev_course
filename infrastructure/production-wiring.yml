# Production wiring manifest (LOS-112).
#
# Lists every production runtime service and what it must be wired to.
# `scripts/check_prod_wiring.py` (`make check-prod-wiring`) compares it with
# docker-compose.yml, docker-compose.prod.yml, the release build matrix in
# .github/workflows/deploy.yml and Terraform, and fails on any drift that is
# not allowlisted below with a reason.
#
# Adding a service: follow the checklist in docs/deployment-yandex-cloud.md
# ("Чеклист подключения нового сервиса к production") and add it here.

services:
  # image:    image name in the deploy.yml build matrix and in prod compose.
  # migrate:  one-shot migrate service the runtime waits for (service_completed_successfully).
  # database: Terraform yandex_mdb_postgresql_database the service writes to.
  auth-service:
    image: auth-service
    migrate: auth-migrate
    database: auth_db
  experiment-service:
    image: experiment-service
    migrate: experiment-migrate
    database: experiment_db
  telemetry-ingest-service:
    image: telemetry-ingest-service
    migrate: telemetry-ingest-migrate
    database: experiment_db
  config-service:
    image: config-service
    migrate: config-migrate
    database: config_db
  script-service:
    image: script-service
    migrate: script-migrate
    database: script_db
  auth-proxy:
    image: auth-proxy
  experiment-portal:
    image: experiment-portal
  sensor-simulator:
    image: sensor-simulator
  redis: {}
  loki: {}
  alloy: {}
  grafana: {}

# Services that exist only in docker-compose.yml.
dev_only_services:
  postgres: Production uses Yandex Managed PostgreSQL created by Terraform.
  minio: Production uses Yandex Object Storage (infrastructure/yandex-cloud/object-storage.tf).
  mailpit: Local SMTP catcher; production does not send email yet (SMTP_ENABLED defaults to false).
  prometheus: Local metrics stack; production observability is Loki + Grafana only.
  alertmanager: Local alerting for the Prometheus stack above.

# Environment keys set for a service in only one of the two compose files.
# "*" applies to every service.
env_differences:
  "*":
    prod_only:
      PGSSLROOTCERT: Managed PostgreSQL requires TLS with the Yandex CA; local postgres has no TLS.
  auth-service:
    dev_only:
      ADMIN_BOOTSTRAP_SECRET: Production creates the first admin with the stdin procedure in docs/admin-initialization.md.
      APP_URL: Only used in email links; production does not send email yet.
      SMTP_ENABLED: Production does not send email yet; the default is false.
      SMTP_FROM: Email is off in production.
      SMTP_FROM_NAME: Email is off in production.
      SMTP_HOST: Email is off in production.
      SMTP_PASSWORD: Email is off in production.
      SMTP_PORT: Email is off in production.
      SMTP_USER: Email is off in production.
  experiment-service:
    dev_only:
      RABBITMQ_URL: No RabbitMQ in production; script execution dispatch is disabled there.
  grafana:
    dev_only:
      GF_AUTH_ANONYMOUS_ORG_ROLE: Anonymous access is a local convenience; production requires login.
      GF_INSTALL_PLUGINS: Local-only plugins.
