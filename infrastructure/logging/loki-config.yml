# Конфигурация Loki для локальной разработки
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2020-10-24
      store: boltdb-shipper
      object_store: filesystem
      schema: v11
      index:
        prefix: index_
        period: 24h

ruler:
  alertmanager_url: http://localhost:9093

# Настройки хранения
storage_config:
  boltdb_shipper:
    active_index_directory: /loki/boltdb-shipper-active
    cache_location: /loki/boltdb-shipper-cache
  filesystem:
    directory: /loki/chunks

compactor:
  working_directory: /loki/boltdb-shipper-compactor

limits_config:
  # The existing v11/boltdb-shipper schema cannot store structured metadata.
  # Keep it disabled until the persisted data is migrated to a v13+ TSDB schema.
  allow_structured_metadata: false
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 32
  max_query_length: 721h
  max_query_parallelism: 32
  max_streams_per_user: 10000
  max_line_size: 256KB
  # Увеличиваем лимиты для поддержки дополнительных labels
  # Каждая уникальная комбинация labels создает отдельный stream
  # С дополнительными labels (level, path, logger, event, method, status_code, etc.)
  # может быть больше уникальных комбинаций
  max_label_name_length: 1024
  max_label_value_length: 4096
  max_label_names_per_series: 30
  # Увеличиваем лимит на количество streams для поддержки фильтрации по новым labels
  max_global_streams_per_user: 0  # 0 = без ограничений (только для локальной разработки!)

table_manager:
  retention_deletes_enabled: true
  retention_period: 168h
