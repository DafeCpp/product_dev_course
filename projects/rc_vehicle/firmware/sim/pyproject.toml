[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rc-sim"
version = "0.1.0"
description = "RC vehicle physics model for SIL simulation (FW-S2 epic, FW-S2.4)"
requires-python = ">=3.12"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["simlib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
