    page:
      type: integer
      description: offset // limit + 1
    page_size:
      type: integer
      description: Effective limit
TelemetryIngestRequest:
  type: object
  required:
  - sensor_id
  - readings
  properties:
    sensor_id:
      type: string
      format: uuid
    run_id:
      type: string
      format: uuid
      nullable: true
      description: "Optional. Usually omitted: service will infer run_id from project's active capture session if present."
    capture_session_id:
      type: string
      format: uuid
      nullable: true
      description: "Optional. Usually omitted: service will auto-attach active capture session. If provided but not active, it won't be attached."
    meta:
      type: object
      description: Optional batch-level metadata merged into each reading meta
      additionalProperties: true
    readings:
      type: array
      minItems: 1
      maxItems: 10000
      items:
        type: object
        required:
        - timestamp
        - raw_value
        properties:
          timestamp:
            type: string
            format: date-time
          raw_value:
            type: number
          physical_value:
            type: number
            nullable: true
          meta:
            type: object
            additionalProperties: true
ComparisonRequest:
