      type:
      - string
      - 'null'
    conversion_profile:
      oneOf:
      - $ref: '#/ConversionProfileInput'
      - type: 'null'
      description: Optional initial profile; `null` is the same as omitting it.
ConversionProfile:
  type: object
  required:
  - id
  - sensor_id
  - project_id
  - version
  - kind
  - payload
  - status
  - valid_from
  - valid_to
  - created_by
  - published_by
  - created_at
  - updated_at
  properties:
    id:
      type: string
      format: uuid
    sensor_id:
      type: string
      format: uuid
    project_id:
      type: string
      format: uuid
    version:
      type: string
    kind:
      type: string
      description: One of ConversionProfileKind for profiles created through the API (stored as free text).
    payload:
      type: object
      additionalProperties: true
    status:
      $ref: '#/ConversionProfileStatus'
    valid_from:
      type:
      - string
      - 'null'
      format: date-time
    valid_to:
      type:
      - string
      - 'null'
      format: date-time
    created_by:
      type: string
      format: uuid
    published_by:
      type:
      - string
      - 'null'
      format: uuid
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time
ConversionProfileInput:
  type: object
  additionalProperties: false
  required:
  - version
  - kind
  - payload
  properties:
    version:
      type: string
      minLength: 1
      maxLength: 50
      description: Unique per sensor.
    kind:
      $ref: '#/ConversionProfileKind'
    payload:
      description: 'Shape depends on `kind` (linear / polynomial / lookup_table). The server defaults
        a missing

        payload to {}, which then fails the per-kind check, so it is effectively required. Extra keys

        inside the payload are accepted.'
      anyOf:
      - $ref: '#/LinearConversionPayload'
      - $ref: '#/PolynomialConversionPayload'
      - $ref: '#/LookupTableConversionPayload'
    status:
      $ref: '#/ConversionProfileStatus'
      default: draft
      description: Initial status; `active` also sets the sensor's active_profile_id.
    valid_from:
      type:
      - string
      - 'null'
      format: date-time
    valid_to:
      type:
      - string
      - 'null'
      format: date-time
ConversionProfileCreate:
  $ref: '#/ConversionProfileInput'
