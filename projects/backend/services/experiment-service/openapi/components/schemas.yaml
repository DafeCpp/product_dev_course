    run_ids:
      type: array
      items:
        type: string
        format: uuid
      minItems: 2
      maxItems: 10
    metric_names:
      type: array
      items:
        type: string
      minItems: 1
      maxItems: 20
    from_step:
      type: integer
      minimum: 0
    to_step:
      type: integer
    max_points_per_series:
      type: integer
      minimum: 100
      maximum: 2000
      default: 500
ComparisonResponse:
  type: object
