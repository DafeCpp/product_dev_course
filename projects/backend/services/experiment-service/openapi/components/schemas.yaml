  - summary
  - series
ComparisonMetricSummary:
  type: object
  properties:
    last_value:
      type:
      - number
      - 'null'
    last_step:
      type:
      - integer
      - 'null'
    min:
      type: number
    max:
      type: number
    avg:
      type: number
    count:
      type: integer
  required:
  - last_value
  - last_step
  - min
  - max
  - avg
  - count
ComparisonPoint:
  type: object
  properties:
    step:
      type: integer
    value:
      type: number
  required:
  - step
  - value
Error:
  type: object
  description: 'JSON error produced by the common error-handling middleware for ServiceError subclasses
    that

    escape a handler, and for unhandled exceptions (500). Errors raised by handlers as aiohttp HTTP

    exceptions are plain text instead (text/plain).'
  required:
  - error
  properties:
    error:
      type: string
SensorStatus:
  type: string
  enum:
  - registering
  - active
  - inactive
  - decommissioned
ConnectionStatus:
  type: string
  description: Computed from last_heartbeat age (online / delayed thresholds from service settings).
  enum:
  - online
  - delayed
  - offline
ConversionProfileStatus:
  type: string
  enum:
  - draft
  - active
  - scheduled
  - deprecated
ConversionProfileKind:
  type: string
  enum:
  - linear
  - polynomial
  - lookup_table
LinearConversionPayload:
  type: object
  description: 'kind=linear: physical = a * raw + b. Both fields are required at runtime.'
  required:
  - a
  - b
  properties:
    a:
      type: number
    b:
      type: number
PolynomialConversionPayload:
  type: object
  description: 'kind=polynomial: physical = c[0] + c[1]*x + c[2]*x^2 + ...'
  required:
  - coefficients
  properties:
    coefficients:
      type: array
      minItems: 1
      items:
        type: number
LookupTablePoint:
  type: object
  required:
  - raw
  - physical
  properties:
    raw:
      type: number
    physical:
      type: number
LookupTableConversionPayload:
  type: object
  description: 'kind=lookup_table: linear interpolation between points, clamped beyond the boundaries.'
  required:
  - table
  properties:
    table:
      type: array
      minItems: 2
      items:
        $ref: '#/LookupTablePoint'
SensorUpdate:
  type: object
  additionalProperties: false
  description: All fields optional; `null` values are ignored. At least one non-null field is expected.
  properties:
    name:
      type: string
    type:
      type: string
    input_unit:
      type: string
    display_unit:
      type: string
    status:
      $ref: '#/SensorStatus'
    calibration_notes:
      type:
      - string
      - 'null'
    last_heartbeat:
      type:
      - string
      - 'null'
      format: date-time
    active_profile_id:
      type:
      - string
      - 'null'
      format: uuid
      description: Must reference an existing conversion profile.
