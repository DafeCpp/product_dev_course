SensorProjectAddRequest:
  type: object
  required:
  - project_id
  description: Other properties are ignored.
  properties:
    project_id:
      type:
      - string
      - 'null'
      format: uuid
      description: Target project. `null` falls back to the X-Project-Id header.
BackfillTaskStatus:
  type: string
  enum:
  - pending
  - running
  - completed
  - failed
BackfillTask:
  type: object
  required:
  - id
  - sensor_id
  - project_id
  - conversion_profile_id
  - status
  - total_records
  - processed_records
  - error_message
  - created_by
  - created_at
  - started_at
  - completed_at
  - updated_at
  properties:
    id:
      type: string
      format: uuid
    sensor_id:
      type: string
      format: uuid
    project_id:
      type: string
      format: uuid
    conversion_profile_id:
      type: string
      format: uuid
      description: Sensor's active profile at the time the task was created.
    status:
      $ref: '#/BackfillTaskStatus'
    total_records:
      type:
      - integer
      - 'null'
      description: Set once the worker has counted the records.
    processed_records:
      type: integer
    error_message:
      type:
      - string
      - 'null'
    created_by:
      type: string
      format: uuid
    created_at:
      type: string
      format: date-time
    started_at:
      type:
      - string
      - 'null'
      format: date-time
    completed_at:
      type:
      - string
      - 'null'
      format: date-time
    updated_at:
      type: string
      format: date-time
BackfillTaskListResponse:
  type: object
  required:
  - backfill_tasks
  - total
  - page
  - page_size
  properties:
    backfill_tasks:
      type: array
      items:
        $ref: '#/BackfillTask'
    total:
      type: integer
      description: Total matching rows
    page:
      type: integer
      description: offset // limit + 1
    page_size:
      type: integer
      description: Effective limit
WebhookCreate:
  type: object
  required:
  - target_url
  - event_types
  description: Unknown properties are ignored.
  properties:
    target_url:
      type: string
      description: Delivery URL (not validated as a URL).
    event_types:
      type: array
      minItems: 1
      items:
        type: string
      description: 'Event types to receive. Not validated against a list; events emitted today: run.started,

        run.finished, run.archived, run.status_changed, run.tags_updated, capture_session.created,

        capture_session.stopped, capture_session.backfill_started, capture_session.backfill_completed.'
    secret:
      type:
      - string
      - 'null'
      description: Optional HMAC-SHA256 signing secret.
WebhookSubscription:
  type: object
  required:
  - id
  - project_id
  - target_url
  - secret
  - event_types
  - is_active
  - created_at
  - updated_at
  properties:
    id:
      type: string
      format: uuid
    project_id:
      type: string
      format: uuid
    target_url:
      type: string
    secret:
      type:
      - string
      - 'null'
      description: Returned in plaintext.
    event_types:
      type: array
      items:
        type: string
    is_active:
      type: boolean
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time
WebhookListResponse:
  type: object
  required:
  - webhooks
  - total
  - page
  - page_size
  properties:
    webhooks:
      type: array
      items:
        $ref: '#/WebhookSubscription'
    total:
      type: integer
      description: Total matching rows
    page:
      type: integer
      description: offset // limit + 1
    page_size:
      type: integer
      description: Effective limit
WebhookDeliveryStatus:
  type: string
  description: '`failed` is a legacy value that may exist in older rows.'
  enum:
  - pending
  - in_progress
  - succeeded
  - dead_lettered
  - failed
WebhookEventEnvelope:
  type: object
  description: Body POSTed to the subscriber.
  required:
  - event_type
  - project_id
  - occurred_at
  - payload
  properties:
    event_type:
      type: string
    project_id:
      type: string
      format: uuid
    occurred_at:
      type: string
      format: date-time
    payload:
      type: object
      additionalProperties: true
WebhookDelivery:
  type: object
  required:
  - id
  - subscription_id
  - project_id
  - event_type
  - target_url
  - secret
  - request_body
  - status
  - attempt_count
  - last_error
  - dedup_key
  - locked_at
  - next_attempt_at
  - created_at
  - updated_at
  properties:
    id:
      type: string
      format: uuid
    subscription_id:
      type: string
      format: uuid
    project_id:
      type: string
      format: uuid
    event_type:
      type: string
    target_url:
      type: string
    secret:
      type:
      - string
      - 'null'
      description: Copied from the subscription; returned in plaintext.
    request_body:
      $ref: '#/WebhookEventEnvelope'
    status:
      $ref: '#/WebhookDeliveryStatus'
    attempt_count:
      type: integer
    last_error:
      type:
      - string
      - 'null'
    dedup_key:
      type:
      - string
      - 'null'
    locked_at:
      type:
      - string
      - 'null'
      format: date-time
    next_attempt_at:
      type: string
      format: date-time
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time
WebhookDeliveryListResponse:
  type: object
  required:
  - deliveries
  - total
  - page
  - page_size
  properties:
    deliveries:
      type: array
      items:
        $ref: '#/WebhookDelivery'
    total:
      type: integer
      description: Total matching rows
    page:
      type: integer
      description: offset // limit + 1
    page_size:
      type: integer
      description: Effective limit
RunBatchResponse:
  type: object
  description: Runs touched by a bulk operation (runs:batch-status, runs:bulk-tags).
  required:
  - runs
  properties:
    runs:
      type: array
      items:
        $ref: '#/Run'
RunBulkTagsRequest:
  type: object
  description: 'Exactly one mode: `set_tags` (replace; may be empty to clear) or `add_tags`/`remove_tags`
    (at least one of them non-empty after trimming). Tags are trimmed, empty strings dropped and duplicates
    removed. In add/remove mode the stored tag array is de-duplicated and sorted.

    '
  required:
  - run_ids
  properties:
    run_ids:
      type: array
      minItems: 1
      items:
        type: string
        format: uuid
    set_tags:
      type: array
      items:
        type: string
    add_tags:
      type: array
      items:
        type: string
    remove_tags:
      type: array
      items:
        type: string
EventActorRole:
  type: string
  description: Role inferred from the actor's permissions when the event was recorded.
  enum:
  - owner
  - editor
  - viewer
RunEvent:
  type: object
  required:
  - id
  - run_id
  - event_type
  - actor_id
  - actor_role
  - payload
  - created_at
  properties:
    id:
      type: integer
      format: int64
    run_id:
      type: string
      format: uuid
    event_type:
      type: string
      description: 'Values written by the service today: run.status_changed, run.tags_updated.'
    actor_id:
      type: string
      format: uuid
    actor_role:
      $ref: '#/EventActorRole'
    payload:
      type: object
      additionalProperties: true
      description: 'run.status_changed: {from, to}. run.tags_updated: {set_tags, add_tags, remove_tags}
        (unused mode is null).

        '
    created_at:
      type: string
      format: date-time
RunEventListResponse:
  type: object
  required:
  - events
  - total
  - page
  - page_size
  properties:
    events:
      type: array
      items:
        $ref: '#/RunEvent'
    total:
      type: integer
    page:
      type: integer
    page_size:
      type: integer
RunSensor:
  type: object
  required:
  - run_id
  - sensor_id
  - project_id
  - mode
  - attached_at
  - detached_at
  - created_by
  properties:
    run_id:
      type: string
      format: uuid
    sensor_id:
      type: string
      format: uuid
    project_id:
      type: string
      format: uuid
    mode:
      type: string
      description: Free-form attachment mode; the API defaults to "passive".
    attached_at:
      type: string
      format: date-time
    detached_at:
      type:
      - string
      - 'null'
      format: date-time
    created_by:
      type: string
      format: uuid
RunSensorListResponse:
  type: object
  description: Sensors currently attached to the run (not paginated).
  required:
  - sensors
  properties:
    sensors:
      type: array
      items:
        $ref: '#/RunSensor'
RunSensorAttachRequest:
  type: object
  properties:
    mode:
      type: string
      default: passive
CaptureSessionListResponse:
  type: object
  required:
  - capture_sessions
  - total
  - page
  - page_size
  properties:
    capture_sessions:
      type: array
      items:
        $ref: '#/CaptureSession'
    total:
      type: integer
    page:
      type: integer
    page_size:
      type: integer
CaptureSessionStopRequest:
  type: object
  description: All fields optional, but the body must be a JSON object (send `{}`).
  properties:
    status:
      allOf:
      - $ref: '#/CaptureSessionStatus'
      default: succeeded
      description: Target status; must be a valid transition from the current one.
    stopped_at:
      type: string
      format: date-time
      description: Defaults to the server's current time.
    archived:
      type: boolean
    notes:
      type: string
CaptureSessionBackfillCompleteResponse:
  description: Capture session after backfill completion plus the number of late rows attached.
  allOf:
  - $ref: '#/CaptureSession'
  - type: object
    required:
    - attached_records
    properties:
      attached_records:
        type: integer
        minimum: 0
        description: Late telemetry rows retroactively linked to the capture session.
CaptureSessionEvent:
  type: object
  required:
  - id
  - capture_session_id
  - event_type
  - actor_id
  - actor_role
  - payload
  - created_at
  properties:
    id:
      type: integer
      format: int64
    capture_session_id:
      type: string
      format: uuid
    event_type:
      type: string
      description: 'Values written by the service today: capture_session.created, capture_session.stopped,
        capture_session.backfill_started, capture_session.backfill_completed.

        '
    actor_id:
      type: string
      format: uuid
    actor_role:
      $ref: '#/EventActorRole'
    payload:
      type: object
      additionalProperties: true
    created_at:
      type: string
      format: date-time
CaptureSessionEventListResponse:
  type: object
  required:
  - events
  - total
  - page
  - page_size
  properties:
    events:
      type: array
      items:
        $ref: '#/CaptureSessionEvent'
    total:
      type: integer
    page:
      type: integer
    page_size:
      type: integer
MetricIngestResponse:
  type: object
  required:
  - status
  - accepted
  properties:
    status:
      type: string
      enum:
      - accepted
    accepted:
      type: integer
      description: Number of metric points stored.
ArtifactListResponse:
  type: object
  required:
  - artifacts
  - total
  - page
  - page_size
  properties:
    artifacts:
      type: array
      items:
        $ref: '#/Artifact'
    total:
      type: integer
    page:
      type: integer
    page_size:
      type: integer
ArtifactApproveRequest:
  type: object
  description: Body must be a JSON object; send `{}` to approve without a note.
  properties:
    note:
      type:
      - string
      - 'null'
ArtifactUploadUrlRequest:
  type: object
  required:
  - filename
  - type
  properties:
    filename:
      type: string
      minLength: 1
      description: Original filename; becomes the last component of the S3 key.
    content_type:
      type: string
      default: application/octet-stream
      description: MIME type the client must send with the PUT upload.
    type:
      type: string
      minLength: 1
      description: Artifact type (model, dataset, log, ...).
    size_bytes:
      type:
      - integer
      - 'null'
    metadata:
      type: object
      additionalProperties: true
    is_restricted:
      type: boolean
      default: false
ArtifactUploadUrlResponse:
  type: object
  required:
  - upload_url
  - artifact_id
  - s3_key
  properties:
    upload_url:
      type: string
      format: uri
      description: Presigned PUT URL.
    artifact_id:
      type: string
      format: uuid
      description: Artifact record created for this upload (uri = s3://<s3_key>).
    s3_key:
      type: string
      description: Object key, artifacts/{project_id}/{run_id}/{uuid}/{filename}.
ArtifactDownloadUrlResponse:
  type: object
  required:
  - download_url
  - expires_in
  properties:
    download_url:
      type: string
      description: 'Presigned GET URL for s3:// artifacts; for legacy artifacts whose uri is not s3://
        this is the stored uri returned as-is.

        '
    expires_in:
      type:
      - integer
      - 'null'
      description: Seconds until the presigned URL expires; null for legacy (non-S3) artifacts.
TelemetryConversionStatus:
  type: string
  enum:
  - raw_only
  - converted
  - client_provided
  - conversion_failed
TelemetryExportRecord:
  type: object
  description: 'One raw telemetry reading in a JSON telemetry export, ordered by timestamp ascending.
    raw_value is present only when raw_or_physical is raw or both; physical_value only when it is physical
    or both.

    '
  required:
  - timestamp
  - sensor_id
  - signal
  - conversion_status
  - capture_session_id
  properties:
    timestamp:
      type: string
      format: date-time
    sensor_id:
      type: string
      format: uuid
    signal:
      type:
      - string
      - 'null'
      description: meta.signal of the reading, null when the reading had none.
    raw_value:
      type: number
    physical_value:
      type:
      - number
      - 'null'
    conversion_status:
      $ref: '#/TelemetryConversionStatus'
    capture_session_id:
      type: string
      format: uuid
      description: Always set, the export filters on capture_session_id.
TelemetryExportAggregateRecord:
  type: object
  description: 'One 1-minute bucket from the telemetry_1m continuous aggregate (aggregation=1m), ordered
    by bucket ascending. Physical aggregates are null when no reading in the bucket had a physical value.

    '
  required:
  - bucket
  - sensor_id
  - signal
  - capture_session_id
  - sample_count
  - avg_raw
  - min_raw
  - max_raw
  - avg_physical
  - min_physical
  - max_physical
  properties:
    bucket:
      type: string
      format: date-time
    sensor_id:
      type: string
      format: uuid
    signal:
      type:
      - string
      - 'null'
    capture_session_id:
      type: string
      format: uuid
    sample_count:
      type: integer
    avg_raw:
      type: number
    min_raw:
      type: number
    max_raw:
      type: number
    avg_physical:
      type:
      - number
      - 'null'
    min_physical:
      type:
      - number
      - 'null'
    max_physical:
      type:
      - number
      - 'null'
