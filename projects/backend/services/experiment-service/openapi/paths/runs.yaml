experimentRuns:
  get:
    tags: [runs]
    summary: List runs
    description: >
      Runs of the experiment, newest first. limit/offset are clamped rather than rejected
      (limit <= 0 becomes 50, limit > 100 becomes 100, offset < 0 becomes 0).
    operationId: listRuns
    parameters:
      - $ref: ../components/parameters.yaml#/ExperimentId
      - $ref: ../components/parameters.yaml#/ProjectIdQuery
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      - name: offset
        in: query
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: status
        in: query
        description: An unknown value is rejected with 400 (`Invalid status value`).
        schema:
          $ref: ../components/schemas.yaml#/RunStatus
      - name: tags
        in: query
        description: Comma separated tags; only runs carrying all of them are returned.
        schema:
          type: string
      - name: created_after
        in: query
        description: ISO-8601, inclusive; a value without offset is treated as UTC.
        schema:
          type: string
          format: date-time
      - name: created_before
        in: query
        description: ISO-8601, inclusive; a value without offset is treated as UTC.
        schema:
          type: string
          format: date-time
    responses:
      200:
        description: Runs
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/RunListResponse
      400:
        $ref: ../components/responses.yaml#/BadRequest
      401:
        $ref: ../components/responses.yaml#/Unauthorized
      403:
        $ref: ../components/responses.yaml#/Forbidden
      404:
        $ref: ../components/responses.yaml#/NotFound
      500:
        $ref: ../components/responses.yaml#/InternalError
  post:
    tags: [runs]
    summary: Create run
    description: >
      experiment_id comes from the path, project_id from ?project_id or X-Project-Id, created_by is
      the calling user; any of these in the body is overwritten. A non-draft initial status must be
      reachable from draft (400 JSON Error otherwise, e.g. `{"error": "Run cannot be created in
      'failed' status"}`). With an Idempotency-Key, a repeat with the same body replays the stored
      201 response.
    operationId: createRun
    parameters:
      - $ref: ../components/parameters.yaml#/ExperimentId
      - $ref: ../components/parameters.yaml#/ProjectIdQuery
      - $ref: ../components/parameters.yaml#/IdempotencyKey
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/RunCreate
    responses:
      201:
        description: Run created
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Run
      400:
        $ref: ../components/responses.yaml#/BadRequest
      401:
        $ref: ../components/responses.yaml#/Unauthorized
      403:
        $ref: ../components/responses.yaml#/Forbidden
      404:
        $ref: ../components/responses.yaml#/NotFound
      409:
        $ref: ../components/responses.yaml#/IdempotencyConflict
      429:
        $ref: ../components/responses.yaml#/TooManyRequests
      503:
        $ref: ../components/responses.yaml#/IdempotencyInProgress

run:
  get:
    tags: [runs]
    summary: Get run
    operationId: getRun
    parameters:
      - $ref: ../components/parameters.yaml#/RunId
      - $ref: ../components/parameters.yaml#/ProjectIdQuery
    responses:
      200:
        description: Run
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Run
      400:
        $ref: ../components/responses.yaml#/BadRequest
      401:
        $ref: ../components/responses.yaml#/Unauthorized
      403:
        $ref: ../components/responses.yaml#/Forbidden
      404:
        $ref: ../components/responses.yaml#/NotFound
  patch:
    tags: [runs]
    summary: Update run
    description: >
      Partial update. A status change must be an allowed transition, and moving to succeeded, failed
      or archived is refused while the run has an active (running/backfilling) capture session; both
      give 409 with a JSON Error naming the reason (e.g. `Invalid run status transition: draft →
      succeeded`, `Cannot finish run while it has an active capture session`). Status changes record a run.status_changed event and emit run.started / run.finished /
      run.archived webhooks. A body with no non-null fields is rejected with 400 (JSON
      `{"error": "No fields provided for update"}`).
    operationId: updateRun
    parameters:
      - $ref: ../components/parameters.yaml#/RunId
      - $ref: ../components/parameters.yaml#/ProjectIdQuery
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/RunUpdate
    responses:
      200:
        description: Run updated
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Run
      400:
        description: Invalid headers, ids or JSON (text/plain); no non-null fields (JSON Error).
        content:
          text/plain:
            schema:
              type: string
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
      401:
        $ref: ../components/responses.yaml#/Unauthorized
      403:
        $ref: ../components/responses.yaml#/Forbidden
      404:
        $ref: ../components/responses.yaml#/NotFound
      409:
        $ref: ../components/responses.yaml#/ServiceConflict
  delete:
    tags: [runs]
    summary: Delete run
    description: >
      Refused with 409 (JSON `{"error": "Cannot delete run while it has an active capture
      session"}`) while the run has an active (running/backfilling) capture session.
    operationId: deleteRun
    parameters:
      - $ref: ../components/parameters.yaml#/RunId
      - $ref: ../components/parameters.yaml#/ProjectIdQuery
    responses:
      204:
        description: Deleted
      400:
        $ref: ../components/responses.yaml#/BadRequest
      401:
        $ref: ../components/responses.yaml#/Unauthorized
      403:
        $ref: ../components/responses.yaml#/Forbidden
      404:
        $ref: ../components/responses.yaml#/NotFound
      409:
        $ref: ../components/responses.yaml#/ServiceConflict

batchStatus:
  post:
    tags: [runs]
    summary: Batch status update
    description: >
      Applies one status to every listed run in a single transaction. Every run must exist in the
      project (404 otherwise), and the transition must be valid for each and, for succeeded/failed/
      archived, no run may have an active capture session. The batch is all-or-nothing: the first
      refused run fails the whole request with 409 and a JSON Error prefixed with its id (e.g.
      `Run <id>: Invalid run status transition: draft → succeeded`); no run is changed. Returned runs
      are in database order, not request order.
    operationId: batchUpdateRunStatus
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectIdQuery
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/RunBatchStatusRequest
    responses:
      200:
        description: Updated runs
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/RunBatchResponse
      400:
        $ref: ../components/responses.yaml#/BadRequest
      401:
        $ref: ../components/responses.yaml#/Unauthorized
      403:
        $ref: ../components/responses.yaml#/Forbidden
      404:
        $ref: ../components/responses.yaml#/NotFound
      409:
        $ref: ../components/responses.yaml#/ServiceConflict

bulkTags:
  post:
    tags: [runs]
    summary: Bulk update run tags
    description: >
      Replaces (set_tags) or adds/removes (add_tags, remove_tags) tags on every listed run in one
      transaction; 404 if any run is missing from the project. Records a run.tags_updated event per run.
      Returned runs are in database order.
    operationId: bulkUpdateRunTags
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectIdQuery
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/RunBulkTagsRequest
    responses:
      200:
        description: Updated runs
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/RunBatchResponse
      400:
        $ref: ../components/responses.yaml#/BadRequest
      401:
        $ref: ../components/responses.yaml#/Unauthorized
      403:
        $ref: ../components/responses.yaml#/Forbidden
      404:
        $ref: ../components/responses.yaml#/NotFound

runEvents:
  get:
    tags: [runs]
    summary: List run audit events
    description: Oldest first. limit/offset are clamped (limit 1-100, default 50).
    operationId: listRunEvents
    parameters:
      - $ref: ../components/parameters.yaml#/RunId
      - $ref: ../components/parameters.yaml#/ProjectIdQuery
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      - name: offset
        in: query
        schema:
          type: integer
          minimum: 0
          default: 0
    responses:
      200:
        description: Run events
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/RunEventListResponse
      400:
        $ref: ../components/responses.yaml#/BadRequest
      401:
        $ref: ../components/responses.yaml#/Unauthorized
      403:
        $ref: ../components/responses.yaml#/Forbidden
      404:
        $ref: ../components/responses.yaml#/NotFound

runSensors:
  get:
    tags: [runs, sensors]
    summary: List sensors attached to a run
    description: >
      Currently attached sensors (detached_at is null), oldest attachment first. A run that is not in
      the project gives 404.
    operationId: listRunSensors
    parameters:
      - $ref: ../components/parameters.yaml#/RunId
      - $ref: ../components/parameters.yaml#/ProjectIdQuery
    responses:
      200:
        description: Attached sensors
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/RunSensorListResponse
      400:
        $ref: ../components/responses.yaml#/BadRequest
      401:
        $ref: ../components/responses.yaml#/Unauthorized
      403:
        $ref: ../components/responses.yaml#/Forbidden
      404:
        $ref: ../components/responses.yaml#/NotFound

runSensor:
  post:
    tags: [runs, sensors]
    summary: Attach sensor to run
    description: >
      Upsert: re-attaching a previously detached sensor clears detached_at and resets attached_at,
      mode and created_by. The body must be a JSON object (send `{}` for the default mode). A run or
      sensor that is not in the project gives 404.
    operationId: attachRunSensor
    parameters:
      - $ref: ../components/parameters.yaml#/RunId
      - $ref: ../components/parameters.yaml#/SensorId
      - $ref: ../components/parameters.yaml#/ProjectIdQuery
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/RunSensorAttachRequest
    responses:
      201:
        description: Sensor attached
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/RunSensor
      400:
        $ref: ../components/responses.yaml#/BadRequest
      401:
        $ref: ../components/responses.yaml#/Unauthorized
      403:
        $ref: ../components/responses.yaml#/Forbidden
      404:
        description: >
          Run or sensor not in the project (sensor primary project, by foreign key). Rendered by the
          error middleware as JSON.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Error
  delete:
    tags: [runs, sensors]
    summary: Detach sensor from run
    description: Soft delete (sets detached_at).
    operationId: detachRunSensor
    parameters:
      - $ref: ../components/parameters.yaml#/RunId
      - $ref: ../components/parameters.yaml#/SensorId
      - $ref: ../components/parameters.yaml#/ProjectIdQuery
    responses:
      204:
        description: Detached
      400:
        $ref: ../components/responses.yaml#/BadRequest
      401:
        $ref: ../components/responses.yaml#/Unauthorized
      403:
        $ref: ../components/responses.yaml#/Forbidden
      404:
        description: Sensor is not currently attached to this run, or the run is not in the project
        content:
          text/plain:
            schema:
              type: string
            example: Sensor not attached to this run
