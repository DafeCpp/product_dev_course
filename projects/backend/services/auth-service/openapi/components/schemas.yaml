User:
  type: object
  required:
  - id
  - username
  - email
  - password_change_required
  - is_active
  - is_admin
  - system_roles
  - created_at
  properties:
    id:
      type: string
      format: uuid
    username:
      type: string
    email:
      type: string
      format: email
    password_change_required:
      type: boolean
    is_active:
      type: boolean
    is_admin:
      type: boolean
      description: Derived from system_roles (admin|superadmin).
    system_roles:
      type: array
      items:
        type: string
    created_at:
      type: string
      format: date-time

UserRegisterRequest:
  type: object
  required:
  - username
  - email
  - password
  properties:
    username:
      type: string
      minLength: 3
      maxLength: 50
    email:
      type: string
      format: email
    password:
      type: string
      format: password
      minLength: 8
      maxLength: 100
      description: Must contain an uppercase letter, a lowercase letter and a digit.
    invite_token:
      type:
      - string
      - 'null'
      format: uuid

UserLoginRequest:
  type: object
  required:
    - username
    - password
  properties:
    username:
      type: string
      description: Username
      example: "johndoe"
    password:
      type: string
      format: password
      description: Password
      example: "securepass123"

AuthTokensResponse:
  type: object
  required:
  - access_token
  - refresh_token
  - password_change_required
  properties:
    access_token:
      type: string
    refresh_token:
      type: string
    password_change_required:
      type: boolean

AuthResponse:
  type: object
  required:
  - user
  - access_token
  - refresh_token
  properties:
    user:
      $ref: '#/User'
    access_token:
      type: string
    refresh_token:
      type: string
    password_change_required:
      type: boolean
      description: Present (true) only on login when a change is required.

TokenRefreshRequest:
  type: object
  required:
    - refresh_token
  properties:
    refresh_token:
      type: string
      description: Refresh token
      example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."

PasswordChangeRequest:
  type: object
  required:
    - old_password
    - new_password
  properties:
    old_password:
      type: string
      format: password
      description: Current password
      example: "oldpass123"
    new_password:
      type: string
      format: password
      minLength: 8
      maxLength: 100
      description: New password (8-100 characters)
      example: "newpass123"

Project:
  type: object
  required:
  - id
  - name
  - description
  - owner_id
  - created_at
  - updated_at
  properties:
    id:
      type: string
      format: uuid
    name:
      type: string
    description:
      type:
      - string
      - 'null'
    owner_id:
      type: string
      format: uuid
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time

ProjectCreateRequest:
  type: object
  required:
  - name
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 200
      description: Project name
      example: My Project
    description:
      type:
      - string
      - 'null'
      maxLength: 1000
      description: Project description
      example: A sample project

ProjectUpdateRequest:
  type: object
  properties:
    name:
      type:
      - string
      - 'null'
      minLength: 1
      maxLength: 200
      description: Project name
      example: Updated Project Name
    description:
      type:
      - string
      - 'null'
      maxLength: 1000
      description: Project description
      example: Updated description

ProjectListResponse:
  type: object
  required:
  - items
  - total
  - limit
  - offset
  properties:
    items:
      type: array
      items:
        $ref: '#/Project'
    total:
      type: integer
    limit:
      type: integer
    offset:
      type: integer

ProjectMember:
  type: object
  required:
  - project_id
  - user_id
  - roles
  - username
  - granted_at
  properties:
    project_id:
      type: string
      format: uuid
    user_id:
      type: string
      format: uuid
    roles:
      type: array
      items:
        type: string
      description: Role names (e.g. owner, editor, viewer, or custom role names).
    username:
      type:
      - string
      - 'null'
    granted_at:
      type:
      - string
      - 'null'
      format: date-time
      description: Earliest active grant.

ProjectMemberAddRequest:
  type: object
  required:
  - user_id
  properties:
    user_id:
      type: string
      format: uuid
    role:
      type: string
      enum:
      - owner
      - editor
      - viewer
      description: Built-in role name; alternative to role_id. One of role/role_id is required.
    role_id:
      type: string
      format: uuid
    expires_at:
      type:
      - string
      - 'null'
      format: date-time

ProjectMemberUpdateRequest:
  type: object
  properties:
    role:
      type: string
      enum:
      - owner
      - editor
      - viewer
    role_id:
      type: string
      format: uuid

ProjectMemberListResponse:
  type: object
  required:
  - members
  properties:
    members:
      type: array
      items:
        $ref: '#/ProjectMember'

Error:
  type: object
  properties:
    error:
      type: string
      description: Error message
      example: "Invalid credentials"

HealthResponse:
  type: object
  properties:
    status:
      type: string
      example: "ok"
    service:
      type: string
      example: "auth-service"
    env:
      type: string
      example: "development"

OkResponse:
  type: object
  properties:
    ok:
      type: boolean
      example: true

ProjectRoleAssignment:
  type: object
  required:
  - user_id
  - project_id
  - role_id
  - granted_by
  - granted_at
  - expires_at
  properties:
    user_id:
      type: string
      format: uuid
    project_id:
      type: string
      format: uuid
    role_id:
      type: string
      format: uuid
    granted_by:
      type: string
      format: uuid
    granted_at:
      type: string
      format: date-time
    expires_at:
      type:
      - string
      - 'null'
      format: date-time
