default_install_hook_types: [pre-commit]

repos:
  - repo: local
    hooks:
      - id: rc-vehicle-clang-format
        name: clang-format (RC Vehicle firmware)
        entry: clang-format-20 -i --style=file
        language: system
        files: ^projects/rc_vehicle/firmware/.*\.(c|cc|cpp|cxx|h|hh|hpp|hxx)$
        exclude: ^projects/rc_vehicle/firmware/(?:tests/build(?:/|$)|tests/build_attitude(?:/|$)|esp32_s3/managed_components(?:/|$)|esp32_s3/\.cache(?:/|$)|sim/\.venv(?:/|$)|graphify-out(?:/|$))
